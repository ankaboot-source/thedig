[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thedig"
dynamic = ["version", "license"]
description = 'enrich informations about a person using OSINT techniques in a privacy-friendly way'
readme = "README.md"
requires-python = ">=3.12"
keywords = []
authors = [{ name = "Badreddine", email = "badreddine@ankaboot.fr" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Framework :: FastAPI",
]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "cryptography>=46.0.5",
    "curl-cffi>=0.14.0",
    "fake-useragent>=2.2.0",
    "fastapi>=0.129.0",
    "fastapi-limiter>=0.1.4,<0.2.0",
    "google-cloud-vision>=3.12.1",
    "httpx[socks]>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "mcp>=1.28.1",
    "pydantic-settings>=2.13.0",
    "pydantic[email]>=2.12.5",
    "patchright>=1.56.0",
    "pyjwt>=2.11.0",
    "pysocks>=1.7.1",
    "python-dotenv>=1.2.1",
    "rapidfuzz>=3.14.3",
    "redis>=7.1.1",
    "requests-ratelimiter>=0.9.1",
    "requests[socks]>=2.32.5",
    "socksio>=1.0.0",
    "typing-extensions>=4.15.0",
    "uvicorn>=0.40.0",
    "whoisdomain>=1.20260106.1",
]

[project.urls]
Documentation = "https://github.com/ankaboot-source/thedig/"
Issues = "https://github.com/ankaboot-source/thedig/issues"
Source = "https://github.com/ankaboot-source/thedig/"

[project.optional-dependencies]
vision = [
    "deepface>=0.0.98",
    "face-recognition",
]

[project.scripts]
thedig-mcp = "thedig.mcp_server:main"

[tool.hatch.version]
path = "thedig/__about__.py"

[tool.hatch.envs.default]
dependencies = ["coverage[toml]>=6.5", "pytest"]
installer = "uv"

[tool.hatch.envs.default.scripts]
test = "pytest {args:thedig/tests}"
test-cov = "coverage run -m pytest {args:thedig/tests}"
cov-report = ["- coverage combine", "coverage report"]
cov = ["test-cov", "cov-report"]

[[tool.hatch.envs.all.matrix]]
python = ["3.12"]

[tool.hatch.envs.lint]
detached = true
dependencies = ["black>=23.1.0", "mypy>=1.0.0", "ruff>=0.0.243"]
[tool.hatch.envs.lint.scripts]
typing = "mypy --install-types --non-interactive {args:thedig thedig/tests}"
style = ["ruff {args:.}", "black --check --diff {args:.}"]
fmt = ["black {args:.}", "ruff --fix {args:.}", "style"]
all = ["style", "typing"]

[tool.black]
target-version = ["py312"]
line-length = 120
skip-string-normalization = true

[tool.ruff]
target-version = "py312"
line-length = 120
lint.select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105",
  "S106",
  "S107",
  # Ignore complexity
  "C901",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
]
lint.unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.lint.isort]
known-first-party = ["thedig"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]
"thedig/tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.coverage.run]
source_pkgs = ["thedig", "tests"]
branch = true
parallel = true
omit = ["thedig/__about__.py"]

[tool.coverage.paths]
thedig = ["thedig", "*/thedig/thedig"]
tests = ["thedig/tests", "*/thedig/thedig/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
markers = [
    "integration: hits live external providers",
]

[tool.uv.sources]
face-recognition = { git = "https://github.com/AdamaB98/face_recognition.git" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.1",
]
